<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Iniciar Sesión</h2>
      <p>SalesInventory System</p>
    </div>

    <form #loginForm="ngForm" (ngSubmit)="onLogin()" class="auth-form">
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="usuario@salesinventory.com" required email autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Contraseña" required autocomplete="current-password" />
      </div>

      <p *ngIf="errorMessage" class="api-error" role="alert">{{ errorMessage }}</p>

      <button type="submit" class="btn btn-primary" [disabled]="isLoading || loginForm.invalid">
        {{ isLoading ? 'Iniciando...' : 'Entrar al Sistema' }}
      </button>
    </form>
  </div>
</div>
