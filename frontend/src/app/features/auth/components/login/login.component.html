@if (isDemo) { <app-demo-banner /> }
<main class="auth-page">
  <section class="auth-brand" aria-hidden="true">
    <span class="brand-mark">SI</span>
    <h2>SalesInventory</h2>
    <p>Control de ventas e inventario para tu operación.</p>
  </section>

  <section class="auth-panel" aria-labelledby="login-title">
    <div class="auth-card">
      <h1 id="login-title">Iniciar sesión</h1>
      <p class="lead">Ingresa con tu cuenta corporativa.</p>

      <form #loginForm="ngForm" (ngSubmit)="onLogin()" class="auth-form" novalidate>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" type="email" maxlength="255" [(ngModel)]="email" name="email" required email
                 autocomplete="username" [attr.aria-invalid]="errorMessage() ? true : null" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" type="password" maxlength="128" [(ngModel)]="password" name="password" required
                 autocomplete="current-password" [attr.aria-invalid]="errorMessage() ? true : null" />
        </div>

        @if (errorMessage()) { <p class="login-error" role="alert">{{ errorMessage() }}</p> }

        <button type="submit" class="btn-submit" [disabled]="isLoading() || loginForm.invalid">
          {{ isLoading() ? 'Verificando…' : 'Entrar' }}
        </button>
        @if (isDemo) {
          <button type="button" class="btn-demo" (click)="loginAsDemo()" [disabled]="isLoading()">Entrar como usuario demo</button>
        }
      </form>
    </div>
  </section>
</main>
