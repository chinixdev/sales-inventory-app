<a class="skip-link" href="#main-content">Saltar al contenido</a>

<div class="shell" [class.menu-open]="menuOpen()">
  <aside id="sidebar" #sidebar class="sidebar" aria-label="Navegación principal" (keydown)="trapFocus($event)">
    <a routerLink="/dashboard" class="brand" aria-label="SalesInventory, ir al dashboard">
      <span class="brand-mark" aria-hidden="true">SI</span>
      <span class="brand-text">SalesInventory</span>
    </a>

    <nav>
      <ul>
        @for (item of navItems(); track item.path) {
          <li>
            <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page" class="nav-link">
              <app-icon [name]="item.icon" />
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
    </nav>

    <p class="sidebar-foot">Ventas e Inventario</p>
  </aside>

  @if (menuOpen()) {
    <button type="button" class="backdrop" aria-label="Cerrar menú" (click)="closeMenu(true)" tabindex="-1"></button>
  }

  <div class="content-area">
    <header class="topbar">
      <button type="button" #menuButton class="icon-btn menu-btn" aria-controls="sidebar"
              [attr.aria-expanded]="menuOpen()" aria-label="Abrir menú de navegación" (click)="toggleMenu()">
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" />
      </button>

      <div class="spacer"></div>

      <app-notification-bell />

      @if (user(); as u) {
        <div class="user" aria-label="Usuario de la sesión">
          <app-icon name="user" />
          <div class="user-text">
            <span class="user-email">{{ u.email ?? 'Sesión activa' }}</span>
            @if (u.role) { <span class="user-role">{{ u.role === 'Admin' ? 'Administrador' : 'Vendedor' }}</span> }
          </div>
        </div>
      }

      <button type="button" class="logout-btn" (click)="logout()">
        <app-icon name="logout" />
        <span>Cerrar sesión</span>
      </button>
    </header>

    <main id="main-content" #mainContent class="main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
