<nav class="main-navbar">
  <div class="nav-brand">
    <a routerLink="/dashboard" class="brand-link">
      <span class="brand-icon">📦</span>
      <span class="brand-name">SalesInventory</span>
    </a>
  </div>

  <div class="nav-links">
    <a *ngFor="let link of navLinks" 
       [routerLink]="link.path" 
       routerLinkActive="active" 
       class="nav-item">
      {{ link.label }}
    </a>
  </div>

  <div class="nav-actions">
    <button type="button" class="nav-btn-login" (click)="logout()">Cerrar sesión</button>
  </div>
</nav>
